<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #dfe9f3, #ffffff, #cfd9df, #e2ebf0);
            background-size: 400% 400%;
            animation: bg 12s ease infinite;
            min-height: 100vh;
        }

        @keyframes bg {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .card-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            border-radius: 18px 18px 0 0 !important;
            padding: 15px 20px;
        }

        .card-header h5 {
            margin: 0;
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            font-size: 14px;
        }

        .btn {
            border-radius: 10px;
            font-weight: 500;
        }

        table {
            border-radius: 12px;
            overflow: hidden;
        }

        thead {
            background: #0d6efd;
            color: white;
        }

        tbody tr:hover {
            background-color: #f1f7ff;
            transition: 0.3s;
        }

        .pagination-btn {
            min-width: 120px;
        }
    </style>
</head>

<body>

<div class="container py-4">

    <form method="POST">

        <!-- HEADER CARD -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5><i class="fas fa-users me-2"></i> Student List</h5>

                <a href="/Student" class="btn btn-light btn-sm">
                    <i class="fas fa-plus-circle"></i> Add Student
                </a>
            </div>

            <!-- FILTER SECTION -->
            <div class="card-body">
                <div class="row g-2 align-items-end">

                    <div class="col-lg-2 col-md-4">
                        <label class="small">First Name</label>
                        <input class="form-control form-control-sm"
                               name="first_name"
                               value="{{form.first_name}}"
                               placeholder="First Name">
                    </div>

                    <div class="col-lg-2 col-md-4">
                        <label class="small">Last Name</label>
                        <input class="form-control form-control-sm"
                               name="last_name"
                               value="{{form.last_name}}"
                               placeholder="Last Name">
                    </div>

                    <div class="col-lg-2 col-md-4">
                        <label class="small">Login (Email)</label>
                        <input class="form-control form-control-sm"
                               name="email"
                               value="{{form.email}}"
                               placeholder="Email">
                    </div>

                    <div class="col-lg-2 col-md-4">
                        <label class="small">Mobile</label>
                        <input class="form-control form-control-sm"
                               name="mobile_no"
                               value="{{form.mobile_no}}"
                               placeholder="Mobile">
                    </div>

                    <div class="col-lg-2 col-md-4">
                        <label class="small">Course</label>
                        <input class="form-control form-control-sm"
                               name="course"
                               value="{{form.course}}"
                               placeholder="Course">
                    </div>

                    <div class="col-lg-2 col-md-4">
                        <button type="submit" name="operation" value="Search"
                                class="btn btn-primary btn-sm w-100">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLE -->
        <div class="card">
            <div class="card-body p-0">

                <table class="table table-hover mb-0">
                    <thead class="text-center">
                    <tr>
                        <th>#</th>
                        <th>FIRST NAME</th>
                        <th>LAST NAME</th>
                        <th>Email</th>
                        <th>DOB</th>
                        <th>MOBILE</th>
                        <th>COURSE</th>
                        <th>ACTION</th>
                    </tr>
                    </thead>

                    <tbody class="text-center">
                    {% for e in page_list %}
                    <tr>
                        <td>{{ form.start_index|add:forloop.counter }}</td>
                        <td>{{e.first_name}}</td>
                        <td>{{e.last_name}}</td>
                        <td>{{e.email}}</td>
                        <td>{{e.dob}}</td>
                        <td>{{e.mobile_no}}</td>
                        <td>{{e.course}}</td>

                        <td>
                            <a href="/Student/{{e.id}}" class="btn btn-primary btn-sm">
                                <i class="fas fa-edit"></i>
                            </a>

                            <a href="/StudentList/delete/{{e.id}}" class="btn btn-danger btn-sm">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                    </tbody>
                </table>

            </div>
        </div>

        <!-- PAGINATION -->
        <div class="d-flex justify-content-between align-items-center mt-3">

            <button type="submit" name="operation" value="Previous"
                    class="btn btn-outline-secondary pagination-btn"
                    {% if not form.has_previous %}disabled{% endif %}>
                <i class="fas fa-arrow-left"></i> Previous
            </button>

            <span class="fw-bold text-primary">
                Page : {{form.page_no}}
            </span>

            <button type="submit" name="operation" value="Next"
                    class="btn btn-outline-secondary pagination-btn"
                    {% if not form.has_next %}disabled{% endif %}>
                Next <i class="fas fa-arrow-right"></i>
            </button>

        </div>

    </form>
</div>

</body>
</html>
